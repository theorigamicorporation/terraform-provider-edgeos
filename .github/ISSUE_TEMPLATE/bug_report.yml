name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Terraform / OpenTofu configuration
      description: A minimal config that shows the problem. Replace real addresses, keys and passwords.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Plan or apply output
      description: Include the error. For API problems, `TF_LOG=DEBUG` output around the failing request helps (check it for secrets first).
      render: shell
  - type: input
    id: provider
    attributes:
      label: Provider version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: Terraform or OpenTofu version
      placeholder: "terraform 1.17.2 / tofu 1.13.9"
    validations:
      required: true
  - type: input
    id: edgeos
    attributes:
      label: Router model and EdgeOS version
      description: "`show version` on the router."
      placeholder: "ER-X, v3.0.1"
    validations:
      required: true
